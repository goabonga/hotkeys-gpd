# /etc/gpd-hotkeysd.conf: gpd-hotkeysd configuration (key = value, # = comment)
# All keys are optional; the values below are the defaults.
# Reload: systemctl reload gpd-hotkeysd

# Backlight: auto (intel_backlight, else raw > platform > firmware)
# or a name under /sys/class/backlight (no path; for tests: --backlight-dir option).
#backlight = auto

# Brightness step in % of max_brightness (1..50); below 10 % the step is 1 %.
#brightness_step = 5

# Raw floor (>= 1: the screen is never turned off).
#brightness_min = 1

# ALSA card, by name (not by number); "hw:..." is accepted as is.
#card = chtrt5645

# Simple element of the master volume ("DAC1 Playback Volume" control, 0 dB max).
# Automatic fallback to Master, then PCM, if it is missing.
#volume_control = DAC1

# Controls (iface MIXER) toggled by the mute key, comma-separated.
# Empty: the playback switch of volume_control, if it has one.
#mute_controls = DAC1 MIXL DAC1 Switch, DAC1 MIXR DAC1 Switch

# Volume step in dB (0.1..20), or in % of the dB range (1%..50%: "1%" is one control
# step on the GPD, 1.15 %), and ceiling in dB (-60..12).
#volume_step = 2
#volume_max_db = 0

# Dedup window (ms) when the same key arrives from several devices,
# and minimum interval (ms) between two steps while a key is held down.
#dedup_ms = 100
#repeat_ms = 80

# Current state (brightness=% volume=% mute=0/1, -1 = unknown) for a status bar segment;
# empty = disabled.
#state_file = /run/gpd-hotkeysd/state
